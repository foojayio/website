# ---------------------------------------------------------------------------
# Footer navigation
#
# Same two-level shape as menu.main above: a top-level entry is a column
# HEADING and its children are the links inside it, so a column is added,
# reordered or relabelled HERE rather than in partials/footer.html.
#
# That is the point of it being config at all. The footer used to be hardcoded
# in the template, i.e. a second definition of the site's navigation with
# nothing tying it to the first -- and it had drifted exactly the way a second
# definition does: three labels disagreed with the header ("Meet The Team" vs
# "Meet the Team", "Where to Find Foojay" vs the long form), the podcast sat in
# the resources column while the nav filed it under News, and four pages the
# nav offers (Java Champions, the Sustainability eBook, the AI portal, Write
# for Foojay) were reachable from the hover panel and nowhere else. One
# convention for both menus means a mismatch is now something you can see.
#
# Params per column: none.
# Params per link:
#   rel   value for the link's rel attribute (rel="me" on the profiles Foojay
#         owns, so they verify back -- see Mastodon/Bluesky identity links)
#   rss   true -> the URL is DERIVED from the home page's RSS output format
#         rather than read from `url`. The feed path is Hugo's to decide (it
#         follows [outputs] home and the format's baseName), and the rest of
#         the theme already derives it via .OutputFormats.Get "rss"; hardcoding
#         "/index.xml" here would be the one copy that goes stale silently.
#
# An http(s) or mailto: `url` is detected as external by the template: it is
# emitted as-is instead of through relURL, and http(s) opens in a new tab.
# ---------------------------------------------------------------------------

