baseURL = "https://foojayio.github.io/website/"
#"https://foojay.io/"
locale = "en-us"
title = "foojay.io - Friends Of OpenJDK"
theme = "foojay"
enableRobotsTXT = true

# Derives each page's lastmod from the last commit that touched its file, which
# is the only thing that can date the 441 pages with no `date:` of their own
# (the Quick Start steps, install-java, the board members). Without it those
# pages ship a <url> with no <lastmod> in sitemap.xml and a `pubDate` of
# 0001-01-01 in any feed they appear in -- an invalid date some readers drop the
# whole item over.
#
# NOTE: this needs the full git history at build time. .github/workflows/
# build-deploy.yml therefore checks out with `fetch-depth: 0`; on the default
# shallow clone every file resolves to the same single commit, so every page
# would claim the same lastmod and the field would be worse than absent.
enableGitInfo = true

# The order matters and is not the default. `:git` sits BELOW `date` on purpose:
# a post's real publish date is in its frontmatter, while its git date is when
# the migration happened -- so leading with :git would stamp all 2147 posts with
# an Aug 2026 lastmod, telling Google the entire archive changed at once. :git
# is the last resort, which is exactly the dateless pages it was added for.
[frontmatter]
  date = ["date", "publishDate", "lastmod", ":git"]
  lastmod = ["lastmod", "date", ":git", "publishDate"]

# Caps every feed the site emits. Hugo's default is -1 (unbounded), which made
# /index.xml a 3.85 MB document of 2584 items -- a feed that size is slow for
# every reader on every poll and is dropped outright by some aggregators.
# Honoured by the embedded RSS template and by layouts/authors/page.rss.xml,
# which reads this same value.
[services]
  [services.rss]
    limit = 30

# Legacy WordPress URLs used explicit per-page overrides (see each .md's `url:`
# frontmatter) rather than relying purely on permalink patterns, because the
# old page tree has inconsistent nesting (e.g. /java-quick-start/install-java/...).
# Posts and authors DO follow a consistent pattern, so we keep it here too.
[permalinks]
  # :slugorcontentbasename -> the `slug` frontmatter if set, otherwise the post's
  # bundle FOLDER name (content/posts/<y>/<m>/<d>/<slug>/). So an author just names
  # the folder and the URL follows -- no `slug` frontmatter needed.
  posts = "/today/:slugorcontentbasename/"
  authors = "/today/author/:slugorcontentbasename/"
  # Sponsors keep their WordPress URL (singular /sponsor/, plural section) --
  # scripts/transfer/Sponsors.java names each bundle folder after the WP slug, so
  # this pattern reproduces the legacy path exactly and no alias is needed.
  sponsors = "/sponsor/:slugorcontentbasename/"
  # Taxonomy term pages live under /today/ too, matching the links the theme and
  # the WordPress site use (default would be /categories/…).
  categories = "/today/category/:slug/"

  # Sponsor (and author) bundles are SECTIONS, not pages -- see the cascade in
  # content/sponsors/_index.md for why. The keys above only apply to `page` kind,
  # so a section needs its pattern here or Hugo would fall back to the file path
  # and serve /sponsors/azul/ instead of the legacy /sponsor/azul/.
  [permalinks.section]
    sponsors = "/sponsor/:slugorcontentbasename/"
    authors = "/today/author/:slugorcontentbasename/"

# Only categories. WordPress DOES tag its posts, but its theme never renders
# tags on a page, so the scrapers (which read the public site) could never see
# them and every post landed with an empty `tags:`. Rather than keep a taxonomy
# that produced 0 term pages against categories' 752, it was dropped -- along
# with the frontmatter key, so authors have one less empty field to wonder
# about. Recoverable from /wp-json/wp/v2/posts?_fields=tags if ever wanted.
[taxonomies]
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Foojay is a place for Friends Of OpenJDK, providing free, reference materials and blogs for daily Java usage."
  # No leading slash: Hugo's relURL only adds the baseURL subpath (e.g. /website/
  # on the GitHub Pages test deploy) to paths that DON'T already start with "/".
  logo = "images/foojay-logo.png"
  favicon = "images/favicon.png"
  # The two authors currently spotlighted as Featured Authors.
  # This is an editorial pick that rotates monthly.
  # Values are author slugs, the same identifiers posts and sponsors use.
  # The list isn't limited to two, but the layouts are designed for that.
  featuredAuthors = ["cristobal-escobar", "shai-almog"]
  # 2026-08 ["cristobal-escobar", "shai-almog"]
  # 2026-07 ["igor-de-souza", "steve-poole"]

  # Where the site lives after cutover, which is NOT baseURL during the trial.
  # Only for URLs handed to an outside system that stores them and that we can't
  # rewrite later -- currently just the giscus backlink (see
  # partials/production-url.html). Everything the build regenerates uses
  # .Permalink and needs no help. When baseURL becomes this value, the two agree
  # and nothing has to change.
  productionBaseURL = "https://foojay.io/"
  # Path to the JUG list consumed by the events sidebar/calendar page.
  jugsDataFile = "jugs"
  eventsDataFile = "events"

  # "Edit this page on GitHub". partials/source-url.html builds the URL from the
  # page's own .File.Path and partials/page-source.html renders the link, so
  # there is nothing per page to write and a page Hugo generates (a taxonomy
  # term, a paginated list) has no source file and correctly gets no link.
  #
  # This is deliberately its OWN repo setting rather than a reuse of
  # params.giscus.repo below: that one names where the site's DISCUSSIONS live,
  # which happens to be the same repository today and is not the same fact.
  # Leaving it unset removes the link everywhere -- which is what a fork, or a
  # local build of someone else's content, should show until it points this at
  # its own repository.
  [params.source]
    repo = "https://github.com/foojayio/website"
    branch = "main"
  # Array of tables (not a single table) so more than one header button can
  # be listed -- header.html ranges over these rather than using `with`.
  [[params.headerCta]]
    label = "Write for Foojay"
    url = "/today/how-to-submit-your-next-article-on-foojay-io/"
  [[params.headerCta]]
    label = "Join our Slack"
    url = "/today/join-slack-com-t-foojay-signup/"

# Comments + reactions, via giscus on this repo's GitHub Discussions -- see
# themes/foojay/layouts/partials/comments.html for the setup steps and for why
# the thread is keyed on the post slug rather than its pathname.
# repoId/categoryId are not secrets (they're public node ids, and they end up in
# the page's HTML), but they can only be read from the GitHub API: get them from
# https://giscus.app.
# The comment section renders only when all four values are filled in, so it stays
# invisible until the "Blog Comments" category exists and its id is pasted here.
# All four are set, so it renders. NOTE these Discussions hold NEW comments only:
# the 580 legacy WordPress ones are an archive in the repo
# (content/posts/**/comments.json, rendered by partials/legacy-comments.html),
# because importing them got the posting account banned by GitHub. See
# scripts/transfer/Comments.java.
[params.giscus]
  repo = "foojayio/website"
  repoId = "R_kgDOTog_lQ"
  category = "Blog Comments"
  categoryId = "DIC_kwDOTog_lc4DDoVm"

# The read counter -- our own Cloudflare Worker on foojay.io itself, not a
# hosted analytics service. It stores a slug and an integer and nothing else,
# and because it is first-party no adblocker can distinguish it from the rest
# of the site, which a third-party tracker script very much cannot say.
# See worker/views/README.md to deploy it, and CLAUDE.md for the design.
#
# Setting `endpoint` is what switches counting on: partials/views-beacon.html
# renders nothing without it, so an unconfigured or local build never posts a
# hit. DISPLAYING a count is independent of it -- that comes from
# data/views.json, which the build refreshes via scripts/fetch/ViewCounts.java.
[params.views]
  endpoint = "https://foojay.io/api/views"

# Google Analytics + Ketch, the two third-party scripts foojay.io runs. See
# themes/foojay/layouts/partials/analytics.html -- it renders NOTHING unless
# the values below are set, and nothing at all while baseURL is still the trial
# URL, so this can be filled in now and goes live by itself at cutover.
#
# `ga` is the GA4 property foojay.io already reports into, and it is worth
# knowing why that id appears NOWHERE in the live site's HTML or in its GTM
# container -- grepping foojay.io for "G-" finds nothing at all. The live chain
# is: container GTM-M6ZT5NW fires a Universal Analytics tag on UA-726113-5;
# Google resolves that id SERVER-SIDE (googletagmanager.com/gtag/destination?
# id=UA-726113-5) and returns a `__zone` tag whose child container is
# G-GS21L12HYK with inheritParentConfig -- Google's UA-to-GA4 "connected site
# tag" migration, which keeps the retired UA id working as an alias for the GA4
# property. That is why the stats are current even though the visible tag is a
# 2023-vintage UA one.
#
# Loading the measurement id directly, as this does, drops that indirection:
# one fewer legacy shim Google can retire unilaterally, and the property is
# named in the repo instead of hidden behind a dead id. Confirm it against
# GA4 Admin > Data streams before cutover.
#
# Ketch is the consent manager, and these two values ARE the live ones -- read
# out of the Custom HTML tag inside that same GTM container, which loads
# https://global.ketchcdn.com/web/v2/config/azul/foojay_io/boot.js. `org` is the
# Ketch organisation ("azul", since Azul runs the Ketch account) and `property`
# is foojay.io's property within it.
[params.analytics]
  ga = "G-GS21L12HYK"
  [params.analytics.ketch]
    org = "azul"
    property = "foojay_io"

# ---------------------------------------------------------------------------
# /llms.txt -- the llmstxt.org convention: a short, markdown-formatted map of
# the site for a model that has a context window rather than a crawl budget.
# The sibling of robots.txt, which says what a machine MAY fetch, while this
# says what is WORTH fetching. Rendered by themes/foojay/layouts/index.llms.txt,
# which derives every line from the footer menu, the pedia section, the Quick
# Start series, the categories taxonomy and the posts by date -- so there is no
# curated list here to go stale.
#
# text/plain rather than text/markdown, because the convention names the file
# .txt and Hugo's builtin text/markdown carries the suffixes "md"/"markdown" --
# adopting it would have meant either /llms.md or redefining a builtin media
# type that the rest of the build uses. The BODY is still markdown; every
# consumer of llms.txt parses it as such regardless of what it is served as.
#
# notAlternative keeps it out of .AlternativeOutputFormats, so baseof.html does
# not advertise it as a <link rel="alternate"> beside the RSS feed on the home
# page -- it is a machine-readable index, not another rendering of the page.
# ---------------------------------------------------------------------------
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "LLMS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

