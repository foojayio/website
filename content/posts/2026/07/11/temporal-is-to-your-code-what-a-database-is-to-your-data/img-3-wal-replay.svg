<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#DCE4EC" stroke-width="1"/>
    </pattern>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E7C6F"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#EEF2F6"/>
  <rect width="900" height="420" fill="url(#grid3)"/>

  <text x="40" y="52" font-size="13" letter-spacing="3" fill="#8FA3B8">FIG. 3</text>
  <text x="40" y="80" font-size="20" font-weight="bold" fill="#1E2A3A">A WRITE-AHEAD LOG FOR YOUR LOCAL VARIABLES</text>

  <!-- event history ledger -->
  <text x="60" y="126" font-size="12" letter-spacing="2" fill="#8FA3B8">EVENT HISTORY (PERSISTED)</text>
  <g transform="translate(60,140)">
    <rect x="0" y="0" width="300" height="200" rx="6" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="1.5"/>
    <g font-size="11" fill="#1E2A3A">
      <text x="16" y="30">001  workflow started</text>
      <text x="16" y="60">002  activity: chargeCard</text>
      <text x="16" y="90">003  result: OK</text>
      <text x="16" y="120">004  timer fired</text>
      <text x="16" y="150">005  activity: sendEmail</text>
    </g>
    <!-- amber commit ticks per row -->
    <g>
      <circle cx="272" cy="26" r="9" fill="#E8A13D"/><path d="M 267 26 L 271 30 L 278 22" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="272" cy="56" r="9" fill="#E8A13D"/><path d="M 267 56 L 271 60 L 278 52" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="272" cy="86" r="9" fill="#E8A13D"/><path d="M 267 86 L 271 90 L 278 82" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="272" cy="116" r="9" fill="#E8A13D"/><path d="M 267 116 L 271 120 L 278 112" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="272" cy="146" r="9" fill="#E8A13D"/><path d="M 267 146 L 271 150 L 278 142" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line x1="16" y1="168" x2="284" y2="168" stroke="#DCE4EC" stroke-width="1"/>
    <text x="16" y="188" font-size="10" fill="#8FA3B8">survives any crash</text>
  </g>

  <!-- crashed JVM -->
  <g transform="translate(430,140)">
    <rect x="0" y="0" width="150" height="86" rx="6" fill="#FFFFFF" stroke="#C4574E" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="75" y="34" font-size="11" fill="#C4574E" text-anchor="middle">JVM · worker A</text>
    <path d="M 84 46 L 68 66 L 80 66 L 64 88" fill="none" stroke="#C4574E" stroke-width="3" stroke-linejoin="round" transform="translate(2,-4)"/>
    <text x="75" y="106" font-size="10" fill="#C4574E" text-anchor="middle">crashed</text>
  </g>

  <!-- replay arrow -->
  <path d="M 370 260 C 470 300 540 300 620 288" fill="none" stroke="#3E7C6F" stroke-width="2.5" marker-end="url(#arr3)"/>
  <text x="490" y="330" font-size="11" fill="#3E7C6F" text-anchor="middle" font-weight="bold">replay history → reconstruct state</text>

  <!-- rehydrated worker -->
  <g transform="translate(630,150)">
    <rect x="0" y="0" width="220" height="180" rx="6" fill="#FFFFFF" stroke="#3E7C6F" stroke-width="2"/>
    <text x="110" y="30" font-size="11" fill="#3E7C6F" text-anchor="middle" font-weight="bold">JVM · worker B</text>
    <line x1="14" y1="44" x2="206" y2="44" stroke="#DCE4EC" stroke-width="1.5"/>
    <g font-size="11" fill="#1E2A3A">
      <text x="18" y="72">int retriesRemaining = 2;</text>
      <text x="18" y="100">step = 3 of 7;</text>
      <text x="18" y="128">loop index i = 4;</text>
    </g>
    <text x="110" y="162" font-size="10" fill="#8FA3B8" text-anchor="middle">exactly where it left off</text>
  </g>
</svg>
