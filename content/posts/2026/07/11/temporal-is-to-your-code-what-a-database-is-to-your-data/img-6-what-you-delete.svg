<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid6" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#DCE4EC" stroke-width="1"/>
    </pattern>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E2A3A"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#EEF2F6"/>
  <rect width="900" height="420" fill="url(#grid6)"/>

  <text x="40" y="52" font-size="13" letter-spacing="3" fill="#8FA3B8">FIG. 6</text>
  <text x="40" y="80" font-size="20" font-weight="bold" fill="#1E2A3A">ADOPTING TEMPORAL MEANS DELETING THINGS</text>

  <!-- LEFT: deletions -->
  <text x="60" y="126" font-size="12" letter-spacing="2" fill="#8FA3B8">git diff — removed</text>
  <g transform="translate(60,142)" font-size="12">
    <rect x="0" y="0" width="330" height="200" rx="6" fill="#FFFFFF" stroke="#8FA3B8" stroke-width="1.5"/>
    <g fill="#C4574E">
      <text x="18" y="34">- status flags + janitor jobs</text>
      <text x="18" y="72">- retry wrappers everywhere</text>
      <text x="18" y="110">- idempotency bookkeeping</text>
      <text x="18" y="148">- queue + cron plumbing</text>
    </g>
    <g stroke="#C4574E" stroke-width="1.2" opacity="0.7">
      <line x1="18" y1="30" x2="255" y2="30"/>
      <line x1="18" y1="68" x2="248" y2="68"/>
      <line x1="18" y1="106" x2="240" y2="106"/>
      <line x1="18" y1="144" x2="228" y2="144"/>
    </g>
    <text x="18" y="184" font-size="10" fill="#8FA3B8">-1,742 lines</text>
  </g>

  <!-- arrow -->
  <line x1="410" y1="240" x2="470" y2="240" stroke="#1E2A3A" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- RIGHT: what remains -->
  <text x="490" y="126" font-size="12" letter-spacing="2" fill="#8FA3B8">what remains</text>
  <g transform="translate(490,142)">
    <rect x="0" y="0" width="350" height="200" rx="6" fill="#1E2A3A"/>
    <g font-size="12" fill="#EEF2F6">
      <text x="20" y="34">chargeCard(order);</text>
      <text x="20" y="64">reserveInventory(order);</text>
      <text x="20" y="94">sendConfirmation(order);</text>
      <text x="20" y="124">awaitShipment(order);</text>
      <text x="20" y="154">Workflow.sleep(ofDays(30));</text>
      <text x="20" y="184">sendReminder(customer);</text>
    </g>
    <!-- commit ticks down the side -->
    <g>
      <circle cx="322" cy="30" r="8" fill="#E8A13D"/><path d="M 318 30 L 321 33 L 327 26" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="322" cy="60" r="8" fill="#E8A13D"/><path d="M 318 60 L 321 63 L 327 56" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="322" cy="90" r="8" fill="#E8A13D"/><path d="M 318 90 L 321 93 L 327 86" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="322" cy="120" r="8" fill="#E8A13D"/><path d="M 318 120 L 321 123 L 327 116" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="322" cy="150" r="8" fill="#E8A13D"/><path d="M 318 150 L 321 153 L 327 146" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="322" cy="180" r="8" fill="#E8A13D"/><path d="M 318 180 L 321 183 L 327 176" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="450" y="380" font-size="11" fill="#8FA3B8" text-anchor="middle">Code that reads like the business process it implements.</text>
</svg>
