<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#DCE4EC" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="420" fill="#EEF2F6"/>
  <rect width="900" height="420" fill="url(#grid4)"/>

  <text x="40" y="52" font-size="13" letter-spacing="3" fill="#8FA3B8">FIG. 4</text>
  <text x="40" y="80" font-size="20" font-weight="bold" fill="#1E2A3A">A TRANSACTION THAT SPANS A MONTH</text>

  <!-- code snippet -->
  <g transform="translate(60,110)">
    <rect x="0" y="0" width="380" height="64" rx="6" fill="#1E2A3A"/>
    <text x="18" y="27" font-size="12" fill="#EEF2F6">Workflow.sleep(Duration.ofDays(30));</text>
    <text x="18" y="49" font-size="12" fill="#EEF2F6">sendRenewalReminder(customer);</text>
  </g>

  <!-- timeline -->
  <line x1="70" y1="270" x2="840" y2="270" stroke="#1E2A3A" stroke-width="2"/>
  <text x="70" y="252" font-size="11" fill="#8FA3B8">DAY 0</text>
  <text x="800" y="252" font-size="11" fill="#8FA3B8">DAY 30</text>

  <!-- start commit tick -->
  <circle cx="110" cy="270" r="14" fill="#E8A13D"/>
  <path d="M 103 270 L 108 276 L 118 264" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="304" font-size="10.5" fill="#1E2A3A" text-anchor="middle">workflow parked</text>
  <text x="110" y="320" font-size="10" fill="#8FA3B8" text-anchor="middle">zero threads · zero pods</text>

  <!-- dormant stretch -->
  <line x1="128" y1="270" x2="740" y2="270" stroke="#E8A13D" stroke-width="3" stroke-dasharray="2 8"/>

  <!-- events during sleep -->
  <g font-size="10.5" fill="#8FA3B8" text-anchor="middle">
    <line x1="260" y1="262" x2="260" y2="278" stroke="#8FA3B8" stroke-width="2"/>
    <text x="260" y="230">deploy #12</text>

    <line x1="400" y1="262" x2="400" y2="278" stroke="#C4574E" stroke-width="2"/>
    <text x="400" y="230" fill="#C4574E">worker crash</text>

    <line x1="540" y1="262" x2="540" y2="278" stroke="#8FA3B8" stroke-width="2"/>
    <text x="540" y="230">deploy #40</text>

    <line x1="650" y1="262" x2="650" y2="278" stroke="#8FA3B8" stroke-width="2"/>
    <text x="650" y="230">servers replaced</text>
  </g>

  <!-- resume -->
  <circle cx="760" cy="270" r="14" fill="#3E7C6F"/>
  <path d="M 755 263 L 768 270 L 755 277 Z" fill="#FFFFFF"/>
  <text x="760" y="304" font-size="10.5" fill="#3E7C6F" text-anchor="middle" font-weight="bold">timer fires · rehydrated</text>
  <text x="760" y="320" font-size="10" fill="#8FA3B8" text-anchor="middle">sendRenewalReminder()</text>

  <text x="450" y="380" font-size="11" fill="#8FA3B8" text-anchor="middle">The process either completes, or resumes from exactly where it stopped.</text>
</svg>
