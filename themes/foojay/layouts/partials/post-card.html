<article class="post-card">
  {{ with .Params.image }}
  <a href="{{ $.Permalink }}" class="post-card-image" tabindex="-1" aria-hidden="true">
    <img src="{{ partial "resource-url.html" (dict "page" $ "src" .) }}" alt="" loading="lazy" decoding="async">
  </a>
  {{ end }}

  <div class="post-card-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    {{ partial "byline.html" . }}
    {{ partial "views.html" . }}
  </div>

  <h3 class="post-card-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h3>

  {{ with .Params.description }}<p class="post-card-excerpt">{{ . | truncate 140 }}</p>{{ end }}

  {{ with .Params.categories }}
  <div class="post-card-categories">
    {{ range first 2 . }}<a href="{{ printf "today/category/%s/" (. | urlize) | relURL }}">{{ . }}</a>{{ end }}
  </div>
  {{ end }}
</article>
