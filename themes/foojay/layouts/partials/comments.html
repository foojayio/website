<!--
  giscus: comments + reactions, backed by GitHub Discussions on this repo. No
  infra to run, and moderation happens in the tools the team already uses.

  Setup (see README.md "Comments"): Discussions enabled on the repo with a
  "Blog Comments" category, the giscus app installed, and [params.giscus] in
  hugo.toml filled in from https://giscus.app. Until all four values are set
  this renders nothing, so an unconfigured build simply has no comments.

  WHICH PAGES GET A SECTION, AND THE TERM THEY USE, ARE IN
  partials/comments-term.html -- the single definition, because toc.html asks
  it the same question to decide whether to offer a "Join the discussion" jump
  link.

  THE TERM IS THE SLUG, NOT THE PATHNAME. giscus finds a discussion by
  searching for its term, and a slug survives a URL change where a pathname
  does not -- every thread created before such a change would be orphaned by
  it. The slug also needs nothing from the author: it is the bundle folder
  name.

  strict="1" for the "must not silently attach to the wrong post" reason:
  non-strict matching is a fuzzy in:title search taking the first hit, and 30
  foojay slugs are substrings of another slug. Strict matches on a hash of the
  term, which is exact.

  THE IMPORTED WORDPRESS COMMENTS ARE NOT IN HERE. They live in the repo, one
  comments.json per post bundle, rendered as its own section below this one by
  partials/legacy-comments.html -- posting them into Discussions got the
  posting account banned as spam. This partial owns NEW comments only.
-->
{{ $term := partial "comments-term.html" . }}
{{ with $term }}
{{/* comments-term.html has already established all four settings are
     present -- it returns "" otherwise -- so this reads them directly. */}}
{{ $g := site.Params.giscus }}
<section id="giscus-comments" class="giscus-section">
  <h2 class="giscus-section__title">Join the discussion</h2>
  <script src="https://giscus.app/client.js"
          data-repo="{{ $g.repo }}"
          data-repo-id="{{ $g.repoId }}"
          data-category="{{ $g.category }}"
          data-category-id="{{ $g.categoryId }}"
          data-mapping="specific"
          data-term="{{ $term }}"
          data-strict="1"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="preferred_color_scheme"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</section>
{{ end }}
