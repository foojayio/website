{{ define "main" }}
<div class="page-head">
  <div class="page-head__inner">
    <span class="eyebrow">Friends of OpenJDK</span>
    <h1>Authors</h1>
    <p>Everyone who has contributed writing to foojay.io.</p>
  </div>
</div>

<div class="content-col full-width">
  <div class="author-grid">
    {{ range where .Site.RegularPages "Section" "authors" }}
      <a class="author-card" href="{{ .Permalink }}">
        {{ with .Params.avatar }}<img src="{{ . | strings.TrimPrefix "/" | relURL }}" alt="" loading="lazy">{{ end }}
        <span>{{ .Title }}</span>
      </a>
    {{ end }}
  </div>
</div>
{{ end }}
