# meetup_slug/meetup_url are derived when `website` is a meetup.com URL;
# scripts/FetchMeetupEvents.java uses meetup_slug to pull calendar events.
#
# The two entries below are a placeholder seed for local `hugo server`
# testing before scripts/FetchJugs.java has ever run in this checkout --
# CI overwrites this file with the full ~100-JUG list on its first run.

