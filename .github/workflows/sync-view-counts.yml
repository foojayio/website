name: Sync view counts

# Split out of sync-external-content.yml, which is now daily: the read counter
# is the one piece of data here that moves continuously (every reader moves it)
# and the only one that isn't external -- it comes from our own Cloudflare
# Worker at foojay.io/api/views. Six-hourly keeps the numbers baked into the
# HTML within a few hours of the counter even when nothing else is pushed.
#
# Offset from the 01:20 daily sync so the two don't collide; they also share a
# concurrency group in case a run ever overlaps.
#
# ONE schedule again. There were two while the Worker was undeployed: a daily
# entry additionally ran transfer/LegacyViews.java --write-views, ~2200 requests
# against foojay.io's live WordPress, to keep the numbers moving in the meantime.
# The Worker answers now, so its legacy + live is the source and the bridge is
# gone. WordPress keeps counting until it is switched off, and catching that up
# is the manual --seed on the cutover list, not a job here -- pushing a new
# baseline needs the Worker's SEED_TOKEN, which CI deliberately does not hold.

on:
  schedule:
    - cron: "50 3,9,15,21 * * *"
  workflow_dispatch: {}

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  views:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JBang
        # Pinned to a TAG, not @main: tracking a moving branch means an upstream
        # commit can break this workflow with no change on our side.
        uses: jbangdev/setup-jbang@v0.1.1

      # Never fails the run: if the counter is unreachable, or answers with
      # fewer pages than data/views.json already carries, the script keeps the
      # committed file and exits 0 -- so a Worker outage costs the site nothing
      # but staler numbers, and an emptied or half-restored database cannot
      # blank every count on the site.
      - name: Refresh view counts
        run: jbang scripts/fetch/ViewCounts.java

      - name: Commit updated data
        run: |
          git config user.name "foojay-bot"
          git config user.email "actions@github.com"
          git add data/views.json
          if git diff --cached --quiet; then
            echo "No view count changes."
          else
            git commit -m "chore: sync view counts"
            git pull --rebase --autostash
            git push
          fi
