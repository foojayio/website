name: Sync view counts

# Split out of sync-external-content.yml, which is now daily: the read counter
# is the one piece of data here that moves continuously (every reader moves it)
# and the only one that isn't external -- it comes from our own Cloudflare
# Worker at foojay.io/api/views. Six-hourly keeps the numbers baked into the
# HTML within a few hours of the counter even when nothing else is pushed.
#
# Offset from the 01:20 daily sync so the two don't collide; they also share a
# concurrency group in case a run ever overlaps.
#
# ONE schedule again. There were two while the Worker was undeployed: a daily
# entry additionally ran transfer/LegacyViews.java --write-views, ~2200 requests
# against foojay.io's live WordPress, to keep the numbers moving in the meantime.
# The Worker answers now, so its legacy + live is the source and the bridge is
# gone. WordPress keeps counting until it is switched off, and catching that up
# is the manual --seed on the cutover list, not a job here -- pushing a new
# baseline needs the Worker's SEED_TOKEN, which CI deliberately does not hold.

on:
  schedule:
    - cron: "50 3,9,15,21 * * *"
  workflow_dispatch: {}

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  views:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For `gh workflow run` in the commit step -- dispatching a workflow is
      # an Actions write, not a contents one.
      actions: write
    steps:
      # A GITHUB APP TOKEN RATHER THAN THE DEFAULT GITHUB_TOKEN, for when main
      # gets a branch ruleset: the built-in Actions token cannot be let through
      # one. A bypass list takes roles, teams, GitHub Apps and deploy keys, and
      # there is no entry for GITHUB_TOKEN -- so the data commit below would be
      # rejected, and in build-deploy.yml the deploy would go down with it, since
      # that push runs before Hugo. The app goes on main's bypass list instead.
      #
      # UNSET TODAY, AND HARMLESS: main is not protected yet, so with no
      # DATA_SYNC_APP_ID variable this step is skipped and checkout falls back to
      # GITHUB_TOKEN, exactly as before. Same in a fork, and in the window
      # between merging this and creating the app. Setup lives in CLAUDE.md
      # under "Protecting main".
      #
      # One behaviour flips when it IS set, and the commit step below depends on
      # knowing which: a push authenticated with an app token triggers
      # workflows, where a GITHUB_TOKEN push never does.
      - name: Mint a push token
        id: app-token
        if: ${{ vars.DATA_SYNC_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DATA_SYNC_APP_ID }}
          private-key: ${{ secrets.DATA_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up JBang
        # Pinned to a TAG, not @main: tracking a moving branch means an upstream
        # commit can break this workflow with no change on our side.
        uses: jbangdev/setup-jbang@v0.1.1

      # Never fails the run: if the counter is unreachable, or answers with
      # fewer pages than data/views.json already carries, the script keeps the
      # committed file and exits 0 -- so a Worker outage costs the site nothing
      # but staler numbers, and an emptied or half-restored database cannot
      # blank every count on the site.
      - name: Refresh view counts
        run: jbang scripts/fetch/ViewCounts.java

      - name: Commit updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "foojay-bot"
          git config user.email "actions@github.com"
          git add data/views.json
          if git diff --cached --quiet; then
            echo "No view count changes."
          else
            git commit -m "chore: sync view counts [skip ci]"
            # PUSH WITH RETRY, because pull-then-push has a window and main has
            # THREE writers, not two: this workflow, the other sync, and
            # build-deploy.yml's own data commit. The `data-sync` concurrency
            # group only serialises the two syncs -- build-deploy.yml is in group
            # `pages`, and has to be, because that group carries
            # cancel-in-progress for the deploy. So it can land a commit between
            # the pull and the push below, and did: on 2026-08-31 this workflow
            # pulled, build-deploy pushed 421fb7b57, and this push was rejected
            # as a non-fast-forward. No amount of concurrency configuration
            # closes a window between two commands; retrying does.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash && git push; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt $attempt) -- main moved under us; retrying."
              sleep $(( attempt * 3 ))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push after 5 attempts; main is moving faster than this job can rebase."
              exit 1
            fi
            # Dispatched rather than left to the push, exactly as in
            # sync-external-content.yml -- see the long comment there. It
            # matters here for the same reason: a read count is baked into the
            # HTML at build time, so a refreshed data/views.json changes nothing
            # a reader can see until the site is rebuilt, and this workflow's
            # own push cannot cause that.
            gh workflow run build-deploy.yml --ref main
          fi
