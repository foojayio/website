name: Sync external content

# The four lists that come from OTHER people's repositories and sites: the
# World Wide JUGs directory, the Java Champions list, the JUG event feeds, and
# the monthly Foojay roundup in Artur Skowronski's JVM Weekly newsletter.
# All four move slowly -- a JUG is added, a Champion edits their entry, an
# event is announced days or weeks ahead, a roundup is published once a month
# -- so this runs once a day.
#
# View counts are the opposite (they move continuously, from our own Worker)
# and live in sync-view-counts.yml on a six-hourly schedule.

on:
  schedule:
    # Once a day, kept off the hour boundary GitHub's cron queue is busiest on.
    - cron: "20 1 * * *"
  workflow_dispatch: {}

# Shared with sync-view-counts.yml: both workflows commit to main, and a
# concurrent push would fail on a non-fast-forward. Queue instead of racing.
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For `gh workflow run` in the commit step -- dispatching a workflow is
      # an Actions write, not a contents one.
      actions: write
    steps:
      # A GITHUB APP TOKEN RATHER THAN THE DEFAULT GITHUB_TOKEN, for when main
      # gets a branch ruleset: the built-in Actions token cannot be let through
      # one. A bypass list takes roles, teams, GitHub Apps and deploy keys, and
      # there is no entry for GITHUB_TOKEN -- so the data commit below would be
      # rejected, and in build-deploy.yml the deploy would go down with it, since
      # that push runs before Hugo. The app goes on main's bypass list instead.
      #
      # UNSET TODAY, AND HARMLESS: main is not protected yet, so with no
      # DATA_SYNC_APP_ID variable this step is skipped and checkout falls back to
      # GITHUB_TOKEN, exactly as before. Same in a fork, and in the window
      # between merging this and creating the app. Setup lives in AGENTS.md
      # under "Protecting main".
      #
      # One behaviour flips when it IS set, and the commit step below depends on
      # knowing which: a push authenticated with an app token triggers
      # workflows, where a GITHUB_TOKEN push never does.
      - name: Mint a push token
        id: app-token
        if: ${{ vars.DATA_SYNC_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DATA_SYNC_APP_ID }}
          private-key: ${{ secrets.DATA_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up JBang
        # Pinned to a TAG, not @main: tracking a moving branch means an upstream
        # commit can break this workflow with no change on our side.
        uses: jbangdev/setup-jbang@v0.1.1

      # Every fetch step below tees into this one log rather than running
      # bare, so a SYNC-DEGRADED line from any of them survives to the health
      # check after all four have run. `pipefail` is Actions' bash default, so
      # a script's own exit code still fails the step through the `tee`.
      - name: Set up the sync log
        run: echo "SYNC_LOG=${RUNNER_TEMP}/sync.log" >> "$GITHUB_ENV"

      # First, so the event fetch below sees the current upstream JUG list
      # rather than whatever was last committed (also refreshed independently
      # at every deploy by build-deploy.yml).
      - name: Refresh JUG list
        run: jbang scripts/fetch/Jugs.java 2>&1 | tee -a "$SYNC_LOG"

      # Independent of the JUG list above -- just piggybacking on the same
      # schedule rather than adding a whole workflow for one script.
      #
      # GEOCODE_API_KEY resolves coordinates for the world map on
      # /java-champions/, and only for places not already in
      # data/geocode-cache.yaml -- normally none, so a normal run makes no
      # geocoding requests. Never fails over it; see the script.
      - name: Refresh Java Champions list
        env:
          GEOCODE_API_KEY: ${{ secrets.GEOCODE_API_KEY }}
        run: jbang scripts/fetch/JavaChampions.java 2>&1 | tee -a "$SYNC_LOG"

      # ONE public request: conferences.json from javaconferences.org, the
      # list behind /java-conferences/ and the conferences on /calendar/.
      # Needs no credential; see the script.
      - name: Refresh Java conferences
        run: jbang scripts/fetch/JavaConferences.java 2>&1 | tee -a "$SYNC_LOG"

      # ~150 requests across meetup.com, Google Calendar and the JUGs' own
      # sites: an iCal feed per JUG, then a page per event that still needs a
      # venue. Needs no credential; see the script.
      - name: Fetch JUG events
        run: jbang scripts/fetch/JugEvents.java 2>&1 | tee -a "$SYNC_LOG"

      # ONE public request: the JVM Weekly RSS feed. Artur publishes a Foojay
      # roundup as the first edition of each month, so this changes monthly at
      # most -- it rides the daily sync rather than earning a workflow, and the
      # script rewrites data/jvm-weekly.yaml only when an edition actually
      # changed. Needs no credential; see the script.
      - name: Fetch the JVM Weekly Foojay roundups
        run: jbang scripts/fetch/JvmWeekly.java 2>&1 | tee -a "$SYNC_LOG"

      # A fetcher that keeps failing over and over is invisible otherwise --
      # every one of the four above exits 0 and keeps its last good file on
      # purpose (see AGENTS.md's "Generated data files"), which is exactly
      # what let data/jugs.yaml sit stale for two and a half weeks with every
      # run reporting green. This opens a tracking issue once a key has been
      # degraded for 48h straight, and closes it on recovery. Never fails the
      # run -- see the script.
      - name: Check sync health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/sync-health.sh "$SYNC_LOG" .github/sync-health.json \
            jugs java-champions java-conferences jug-events jvm-weekly

      - name: Commit updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "foojay-bot"
          git config user.email "actions@github.com"
          # data/geocode-cache.yaml is committed for the same reason the data
          # files are: it is the only copy, and it is what keeps the champions
          # geocoding down to zero requests on a normal run.
          #
          # .github/sync-health.json rides along in the same commit, but NOT
          # the same deploy decision below: it is bookkeeping for the health
          # check above, not content, and opening or closing a tracking issue
          # must not by itself spend a deploy.
          git add data/jugs.yaml data/java-champions.yaml data/geocode-cache.yaml data/java-conferences.yaml data/jug-events.json data/jvm-weekly.yaml .github/sync-health.json
          if git diff --cached --quiet; then
            echo "No JUG list, Java Champions, event, JVM Weekly or sync-health changes."
          else
            if git diff --cached --quiet -- data/; then
              data_changed=false
            else
              data_changed=true
            fi
            git commit -m "chore: sync JUG list + Java Champions + conferences + JUG events + JVM Weekly [skip ci]"
            # PUSH WITH RETRY, because pull-then-push has a window. main had
            # THREE writers when this loop was written -- this workflow, the
            # other sync, and build-deploy.yml's own data commit -- and the
            # `data-sync` concurrency group only serialises the first two. On
            # 2026-08-31 this workflow pulled, build-deploy pushed 421fb7b57,
            # and this push was rejected as a non-fast-forward. build-deploy no
            # longer commits, so the two writers left here are serialised and
            # the race is closed. The retry stays: a human pushing to main is a
            # fourth writer nothing serialises, and no amount of concurrency
            # configuration closes a window between two commands.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash && git push; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt $attempt) -- main moved under us; retrying."
              sleep $(( attempt * 3 ))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push after 5 attempts; main is moving faster than this job can rebase."
              exit 1
            fi
            # THE DEPLOY IS DISPATCHED, NOT LEFT TO THE PUSH -- and that is the
            # fix to a bug that was silent for as long as this workflow has
            # existed. A push authenticated with GITHUB_TOKEN never starts a
            # workflow run (documented, and confirmed against the run history:
            # commit be7257d8, "sync JUG list + Java Champions + JUG events",
            # appears in no build-deploy run). So the data landed on main and
            # nothing rebuilt the site: a new meetup sat in
            # data/jug-events.json, and a refreshed read count in
            # data/views.json, until a human happened to push -- on a quiet week
            # /calendar/ was days stale while the file behind it was current.
            #
            # workflow_dispatch is the documented EXCEPTION to that rule: it
            # always creates a run, GITHUB_TOKEN or not. So the deploy is asked
            # for explicitly, here, and only on the runs where something actually
            # changed -- every script above leaves its file untouched otherwise.
            #
            # [skip ci] on the commit therefore matters even though nothing acts
            # on it today: when main is protected and this pushes with a GitHub
            # App token instead (see the "Mint a push token" step), that push
            # WILL trigger build-deploy, and without it every sync would build
            # twice -- once from the push, once from this dispatch. One trigger,
            # chosen deliberately, in both worlds.
            #
            # Gated on data_changed, not on this step having committed at all:
            # a run that only opened or closed a sync-health tracking issue
            # has nothing new for a reader, and dispatching on that would
            # rebuild and redeploy the whole site over a GitHub issue.
            if [ "$data_changed" = true ]; then
              gh workflow run build-deploy.yml --ref main
            else
              echo "Only sync-health changed -- not dispatching a deploy."
            fi
          fi
