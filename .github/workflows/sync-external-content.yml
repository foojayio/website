name: Sync external content

# The three lists that come from OTHER people's repositories and sites: the
# World Wide JUGs directory, the Java Champions list, and the JUG event feeds.
# All three move slowly -- a JUG is added, a Champion edits their entry, an
# event is announced days or weeks ahead -- so this runs once a day.
#
# View counts are the opposite (they move continuously, from our own Worker)
# and live in sync-view-counts.yml on a six-hourly schedule.

on:
  schedule:
    # Once a day, kept off the hour boundary GitHub's cron queue is busiest on.
    - cron: "20 1 * * *"
  workflow_dispatch: {}

# Shared with sync-view-counts.yml: both workflows commit to main, and a
# concurrent push would fail on a non-fast-forward. Queue instead of racing.
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For `gh workflow run` in the commit step -- dispatching a workflow is
      # an Actions write, not a contents one.
      actions: write
    steps:
      # A GITHUB APP TOKEN RATHER THAN THE DEFAULT GITHUB_TOKEN, for when main
      # gets a branch ruleset: the built-in Actions token cannot be let through
      # one. A bypass list takes roles, teams, GitHub Apps and deploy keys, and
      # there is no entry for GITHUB_TOKEN -- so the data commit below would be
      # rejected, and in build-deploy.yml the deploy would go down with it, since
      # that push runs before Hugo. The app goes on main's bypass list instead.
      #
      # UNSET TODAY, AND HARMLESS: main is not protected yet, so with no
      # DATA_SYNC_APP_ID variable this step is skipped and checkout falls back to
      # GITHUB_TOKEN, exactly as before. Same in a fork, and in the window
      # between merging this and creating the app. Setup lives in CLAUDE.md
      # under "Protecting main".
      #
      # One behaviour flips when it IS set, and the commit step below depends on
      # knowing which: a push authenticated with an app token triggers
      # workflows, where a GITHUB_TOKEN push never does.
      - name: Mint a push token
        id: app-token
        if: ${{ vars.DATA_SYNC_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DATA_SYNC_APP_ID }}
          private-key: ${{ secrets.DATA_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up JBang
        # Pinned to a TAG, not @main: tracking a moving branch means an upstream
        # commit can break this workflow with no change on our side.
        uses: jbangdev/setup-jbang@v0.1.1

      # First, so the event fetch below sees the current upstream JUG list
      # rather than whatever was last committed (also refreshed independently
      # at every deploy by build-deploy.yml).
      - name: Refresh JUG list
        run: jbang scripts/fetch/Jugs.java

      # Independent of the JUG list above -- just piggybacking on the same
      # schedule rather than adding a whole workflow for one script.
      #
      # GEOCODE_API_KEY resolves coordinates for the world map on
      # /java-champions/, and only for places not already in
      # data/geocode-cache.yaml -- normally none, so a normal run makes no
      # geocoding requests. Never fails over it; see the script.
      - name: Refresh Java Champions list
        env:
          GEOCODE_API_KEY: ${{ secrets.GEOCODE_API_KEY }}
        run: jbang scripts/fetch/JavaChampions.java

      # ~150 requests across meetup.com, Google Calendar and the JUGs' own
      # sites: an iCal feed per JUG, then a page per event that still needs a
      # venue. Needs no credential; see the script.
      - name: Fetch JUG events
        run: jbang scripts/fetch/JugEvents.java

      - name: Commit updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "foojay-bot"
          git config user.email "actions@github.com"
          # data/geocode-cache.yaml is committed for the same reason the data
          # files are: it is the only copy, and it is what keeps the champions
          # geocoding down to zero requests on a normal run.
          git add data/jugs.yaml data/java-champions.yaml data/geocode-cache.yaml data/jug-events.json
          if git diff --cached --quiet; then
            echo "No JUG list, Java Champions or event changes."
          else
            git commit -m "chore: sync JUG list + Java Champions + JUG events [skip ci]"
            # PUSH WITH RETRY, because pull-then-push has a window and main has
            # THREE writers, not two: this workflow, the other sync, and
            # build-deploy.yml's own data commit. The `data-sync` concurrency
            # group only serialises the two syncs -- build-deploy.yml is in group
            # `pages`, and has to be, because that group carries
            # cancel-in-progress for the deploy. So it can land a commit between
            # the pull and the push below, and did: on 2026-08-31 this workflow
            # pulled, build-deploy pushed 421fb7b57, and this push was rejected
            # as a non-fast-forward. No amount of concurrency configuration
            # closes a window between two commands; retrying does.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash && git push; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt $attempt) -- main moved under us; retrying."
              sleep $(( attempt * 3 ))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push after 5 attempts; main is moving faster than this job can rebase."
              exit 1
            fi
            # THE DEPLOY IS DISPATCHED, NOT LEFT TO THE PUSH -- and that is the
            # fix to a bug that was silent for as long as this workflow has
            # existed. A push authenticated with GITHUB_TOKEN never starts a
            # workflow run (documented, and confirmed against the run history:
            # commit be7257d8, "sync JUG list + Java Champions + JUG events",
            # appears in no build-deploy run). So the data landed on main and
            # nothing rebuilt the site: a new meetup sat in
            # data/jug-events.json, and a refreshed read count in
            # data/views.json, until a human happened to push -- on a quiet week
            # /calendar/ was days stale while the file behind it was current.
            #
            # workflow_dispatch is the documented EXCEPTION to that rule: it
            # always creates a run, GITHUB_TOKEN or not. So the deploy is asked
            # for explicitly, here, and only on the runs where something actually
            # changed -- every script above leaves its file untouched otherwise.
            #
            # [skip ci] on the commit therefore matters even though nothing acts
            # on it today: when main is protected and this pushes with a GitHub
            # App token instead (see the "Mint a push token" step), that push
            # WILL trigger build-deploy, and without it every sync would build
            # twice -- once from the push, once from this dispatch. One trigger,
            # chosen deliberately, in both worlds.
            gh workflow run build-deploy.yml --ref main
          fi
