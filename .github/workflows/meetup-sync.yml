name: Daily JUG list + Meetup events sync

on:
  schedule:
    # 05:00 UTC daily
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  sync-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JBang
        uses: jbangdev/setup-jbang@main

      # Refresh the JUG list first so this always targets the current
      # upstream World Wide JUGs directory, not whatever was last committed
      # (also refreshed independently at every deploy by build-deploy.yml).
      - name: Refresh JUG list
        run: jbang scripts/FetchJugs.java

      - name: Fetch events from Meetup
        env:
          MEETUP_OAUTH_TOKEN: ${{ secrets.MEETUP_OAUTH_TOKEN }}
        run: jbang scripts/FetchMeetupEvents.java

      - name: Commit updated data
        run: |
          git config user.name "foojay-bot"
          git config user.email "actions@github.com"
          git add data/jugs.yaml data/events.json
          if git diff --cached --quiet; then
            echo "No JUG list or event changes today."
          else
            git commit -m "chore: daily JUG list + Meetup events sync"
            git push
          fi
