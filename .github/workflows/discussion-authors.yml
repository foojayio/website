name: Notify authors of discussions

# giscus creates the discussion with the first comment, so `created` is the
# moment a reader starts one. Commits nothing.

on:
  discussion:
    types: [created]

permissions:
  contents: read
  discussions: write

jobs:
  notify:
    # Disabled while scripts/migrate/Discussions.java imports the archive: every
    # imported discussion would mention authors and post to Slack.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/notify
            content/posts
            content/authors
      - uses: jbangdev/setup-jbang@v0.1.1
      - name: Mention the authors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_CONTENT }}
          TITLE: ${{ github.event.discussion.title }}
          URL: ${{ github.event.discussion.html_url }}
          NODE_ID: ${{ github.event.discussion.node_id }}
        run: jbang scripts/notify/DiscussionAuthors.java "$TITLE" "$URL" "$NODE_ID"
