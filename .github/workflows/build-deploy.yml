name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  # read: nothing here commits any more. The data/ files are refreshed by the
  # two scheduled syncs, which own the write.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # NO APP TOKEN HERE ANY MORE. One was minted so the data commit below
      # could get past a branch ruleset on main, since GITHUB_TOKEN cannot be
      # put on a bypass list. With the commit gone this job only reads, and the
      # default token reads a protected branch perfectly well. The two syncs
      # still mint one, because they still push. See AGENTS.md, "Protecting
      # main".
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # hugo.toml sets enableGitInfo, which dates every page from the last
          # commit that touched its file. The default shallow clone (depth 1)
          # collapses that to one commit for the whole tree, so every page would
          # report the same lastmod -- worse than having none. Full history is
          # the price of a truthful sitemap.
          fetch-depth: 0

      - name: Set up JBang
        # Pinned to a TAG, not @main: tracking a moving branch means an upstream
        # commit can break this workflow with no change on our side.
        uses: jbangdev/setup-jbang@v0.1.1

      # NO DATA REFRESH HERE, AND THAT IS THE POINT. This job used to run
      # fetch/Jugs.java, fetch/JavaChampions.java and fetch/ViewCounts.java and
      # commit the result, so every single push to main produced a second
      # commit -- "chore: refresh JUG list + Java Champions list + view counts"
      # -- whether or not anything upstream had moved. It also made this
      # workflow a THIRD writer to main alongside the two syncs, which is what
      # the retry loops in those files were fighting.
      #
      # The scheduled syncs already do the same work: sync-external-content.yml
      # daily for the JUG list, the Champions and the events, and
      # sync-view-counts.yml four times a day for the counter. Both dispatch
      # this workflow when they actually change something, so refreshed data
      # still reaches the site on the same build it always did. What is gone is
      # a refresh on every unrelated push. A deploy now builds what is in the
      # repo, which is the one job a deploy should have.

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      # AsciiDoc articles (content/**/index.adoc) are rendered by asciidoctor,
      # which Hugo shells out to -- see hugo.toml [security.exec]. The runner
      # image ships Ruby but not this gem, and a missing binary is NOT a soft
      # failure: Hugo reports "failed to execute binary" and the build dies, so
      # every job that runs `hugo` needs this whether or not the branch happens
      # to touch a .adoc file.
      #
      # Pinned for the same reason the Hugo version is: asciidoctor's HTML is
      # what themes/foojay/static/css/style.css styles by class name, and a
      # major bump changing that markup should be a deliberate upgrade rather
      # than a Tuesday.
      #
      # --user-install, NOT sudo. The runner's Ruby is the distro one and its
      # gem dir (/var/lib/gems/3.2.0) is root-owned, so a plain `gem install`
      # fails with Gem::FilePermissionError. `sudo gem install` would also fix
      # that, but it installs for a user that is NOT the one running Hugo;
      # keeping the gem in the runner user's own home means the binary Hugo
      # shells out to belongs to the process that shells out to it, and nothing
      # in the build needs elevation.
      #
      # GITHUB_PATH / GITHUB_ENV rather than PATH= and GEM_HOME=: each `run`
      # step is its own shell, so an export here would be gone by the time Hugo
      # runs. Appending to those two files is what carries them to later steps.
      #
      # GEM_HOME IS SET EXPLICITLY, not left to Ruby. The binstub finds its own
      # gem through Gem.user_dir, which is derived from XDG_DATA_HOME -- and
      # Hugo hands the asciidoctor process a FILTERED environment
      # (hugo.toml [security.exec] osEnv) that passes HOME and GEM_HOME but not
      # XDG_DATA_HOME. Unset on today's runner image, so it would work by luck;
      # naming the directory outright means it keeps working if that changes.
      - name: Set up Asciidoctor
        run: |
          gem install asciidoctor -v 2.0.26 --no-document --user-install
          echo "GEM_HOME=$(ruby -e 'puts Gem.user_dir')" >> "$GITHUB_ENV"
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Verify Asciidoctor is on PATH
        # A missing binary makes Hugo fail deep inside a template render, with a
        # message about executing a binary rather than about a missing gem. One
        # line here turns that into an obvious failure at the step that owns it.
        run: asciidoctor --version

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      # The `id: pages` above is required for steps.pages.outputs.base_url to
      # resolve. Without it the expression is empty and Hugo builds with
      # baseURL "/", so every relURL asset (css/js/images) 404s under the
      # /website/ project-pages subpath. base_url already includes that subpath.
      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # No external search service: Pagefind crawls the already-built HTML in
      # public/ and writes a static, chunked search index there
      # (public/pagefind/). themes/foojay/layouts/search/single.html loads it
      # client-side. `data-pagefind-body` (baseof.html) + `data-pagefind-ignore`
      # (sidebar.html) control what gets indexed -- see comments there.
      - name: Build search index (Pagefind)
        run: npx -y pagefind --site public

      # The gate. Runs against the public/ directory that is about to BECOME the
      # deploy, so a broken build stops here rather than after it has replaced
      # the live site. Two checks, both derived from content/ and hugo.toml, so
      # there is no list of URLs to keep in step: every source page produced a
      # built page, and every link the site itself emits resolves to a file that
      # exists. Dead links inside article text are reported but do not block --
      # see the script's header for why those two are not the same problem.
      #
      # Deliberately NOT a separate job: the Pages artifact is ~700 MB, so a
      # validate job would upload and re-download all of it to check bytes that
      # are already sitting right here. It reads files rather than making HTTP
      # requests, so it needs no server and cannot be flaky.
      - name: Validate the built site
        run: jbang scripts/validate/BuiltSite.java

      # The browser half of the gate. Everything above is static analysis; this
      # is the only thing that can tell whether the site WORKS -- search is
      # filled in client-side by Pagefind, the maps and the lightbox exist only
      # after JavaScript runs, and all of those fail silently, with a 200 and a
      # full-looking page.
      #
      # The "staging environment" is tests/e2e/server.mjs: the built public/
      # directory served on localhost, reachable only from this run. It mimics
      # GitHub Pages specifically (pretty URLs, a 301 on a missing trailing
      # slash, 404.html with a 404 status, everything under the base path), so a
      # link that escapes /website/ fails here exactly as it would in
      # production. No staging deploy, nothing public, nothing to clean up.
      #
      # Third-party requests are stubbed inside the tests, so this makes no
      # network calls to YouTube, Vimeo or Google Fonts and cannot go red
      # because someone else's CDN is having an afternoon.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      # The browser binary is ~170 MB and does not change between runs; the key
      # is the lockfile, so it re-downloads exactly when the pinned Playwright
      # version moves and never otherwise.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Both install steps below shell out to `apt-get update`, and apt exits
      # 100 if ANY configured repo serves a bad index -- including repos nothing
      # here uses. The runner image ships Google's Chrome repo, and on
      # 2026-09-09 it served a Packages.gz whose hash did not match the Release
      # file published alongside it, failing two deploys in a row on an error
      # that had nothing to do with the site.
      #
      # Nothing in these tests touches system Chrome: the config is
      # `devices['Desktop Chrome']` with no `channel`, so Playwright drives its
      # own bundled chromium from ~/.cache/ms-playwright, and the packages
      # install-deps wants (libnss3, libasound2t64 and friends) all come from the
      # Ubuntu archives. So drop the source instead of waiting for Google to fix
      # their mirror -- the same reasoning as stubbing third-party requests in
      # the tests above, one layer down. Widen the pattern if another
      # third-party repo on the image starts doing the same thing.
      - name: Drop apt sources the browser install does not need
        run: |
          sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Check the site in a browser
        run: npm run test:e2e

      # Only on failure, and only for a fortnight: the trace and screenshots are
      # how you find out WHY a deploy was blocked without reproducing it
      # locally, and they are worthless once the run is old.
      - name: Upload the failing traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
