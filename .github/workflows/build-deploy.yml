name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  # write, not read: the "Refresh ..." steps below commit the regenerated
  # data/ files back to main after fetching them fresh.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A GITHUB APP TOKEN RATHER THAN THE DEFAULT GITHUB_TOKEN, for when main
      # gets a branch ruleset: the built-in Actions token cannot be let through
      # one. A bypass list takes roles, teams, GitHub Apps and deploy keys, and
      # there is no entry for GITHUB_TOKEN -- so the data commit below would be
      # rejected, and in build-deploy.yml the deploy would go down with it, since
      # that push runs before Hugo. The app goes on main's bypass list instead.
      #
      # UNSET TODAY, AND HARMLESS: main is not protected yet, so with no
      # DATA_SYNC_APP_ID variable this step is skipped and checkout falls back to
      # GITHUB_TOKEN, exactly as before. Same in a fork, and in the window
      # between merging this and creating the app. Setup lives in CLAUDE.md
      # under "Protecting main".
      #
      # One behaviour flips when it IS set, and the commit step below depends on
      # knowing which: a push authenticated with an app token triggers
      # workflows, where a GITHUB_TOKEN push never does.
      - name: Mint a push token
        id: app-token
        if: ${{ vars.DATA_SYNC_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DATA_SYNC_APP_ID }}
          private-key: ${{ secrets.DATA_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          submodules: recursive
          # hugo.toml sets enableGitInfo, which dates every page from the last
          # commit that touched its file. The default shallow clone (depth 1)
          # collapses that to one commit for the whole tree, so every page would
          # report the same lastmod -- worse than having none. Full history is
          # the price of a truthful sitemap.
          fetch-depth: 0

      - name: Set up JBang
        # Pinned to a TAG, not @main: tracking a moving branch means an upstream
        # commit can break this workflow with no change on our side.
        uses: jbangdev/setup-jbang@v0.1.1

      # Refreshes data/jugs.yaml from the World Wide JUGs directory
      # (https://github.com/World-Wide-JUGs/GlobalWWJugs) so the /jugs/ page
      # is never more than one build behind that upstream list. Also run once
      # a day by .github/workflows/sync-external-content.yml, independent of
      # deploys.
      - name: Refresh JUG list
        run: jbang scripts/fetch/Jugs.java

      # Refreshes data/java-champions.yaml from the official Java Champions
      # directory (https://github.com/aalmiray/java-champions) so /java-champions/
      # is never more than one build behind it. Also run once a day by
      # .github/workflows/sync-external-content.yml, independent of deploys.
      #
      # GEOCODE_API_KEY resolves coordinates for the world map on that page, and
      # only for champions whose city isn't already in data/geocode-cache.yaml --
      # so a normal deploy makes NO geocoding requests at all and this costs
      # nothing. The script never fails over it: no secret, or a geocoder that is
      # down, just leaves the newest champions off the map until the next run.
      - name: Refresh Java Champions list
        env:
          GEOCODE_API_KEY: ${{ secrets.GEOCODE_API_KEY }}
        run: jbang scripts/fetch/JavaChampions.java

      # Refreshes data/views.json from the read counter (worker/views/), so the
      # view count on each post and card is baked into the HTML rather than
      # fetched by the reader's browser. Never fails the build: if the counter
      # is unreachable the committed file is left alone and yesterday's numbers
      # ship, which beats a red deploy over an analytics blip. Also run every
      # six hours by .github/workflows/sync-view-counts.yml -- the counter is
      # the one data source here that moves continuously, which is why it has
      # its own workflow instead of riding the daily external-content sync.
      - name: Refresh view counts
        run: jbang scripts/fetch/ViewCounts.java

      - name: Commit updated data
        run: |
          git config user.name "foojay-bot"
          git config user.email "actions@github.com"
          # data/geocode-cache.yaml is committed for the same reason the data
          # files are: it is the only copy, and it is what keeps the champions
          # geocoding down to zero requests on a normal run.
          git add data/jugs.yaml data/java-champions.yaml data/geocode-cache.yaml data/views.json
          if git diff --cached --quiet; then
            echo "No JUG list, Java Champions or view count changes."
          else
            # [skip ci] IS LOAD-BEARING NOW, where it used to be belt-and-
            # braces: this push is to the same branch/event this workflow
            # triggers on, and since it is authenticated with an app token
            # rather than GITHUB_TOKEN it really does start workflow runs. So
            # without this, every push to main would build and deploy twice.
            # (Nothing rebuilds off THIS commit, and nothing needs to -- the
            # run that made it goes on to build with the refreshed files.)
            git commit -m "chore: refresh JUG list + Java Champions list + view counts [skip ci]"
            git push
          fi

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      # The `id: pages` above is required for steps.pages.outputs.base_url to
      # resolve. Without it the expression is empty and Hugo builds with
      # baseURL "/", so every relURL asset (css/js/images) 404s under the
      # /website/ project-pages subpath. base_url already includes that subpath.
      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # No external search service: Pagefind crawls the already-built HTML in
      # public/ and writes a static, chunked search index there
      # (public/pagefind/). themes/foojay/layouts/search/single.html loads it
      # client-side. `data-pagefind-body` (baseof.html) + `data-pagefind-ignore`
      # (sidebar.html) control what gets indexed -- see comments there.
      - name: Build search index (Pagefind)
        run: npx -y pagefind --site public

      # The gate. Runs against the public/ directory that is about to BECOME the
      # deploy, so a broken build stops here rather than after it has replaced
      # the live site. Two checks, both derived from content/ and hugo.toml, so
      # there is no list of URLs to keep in step: every source page produced a
      # built page, and every link the site itself emits resolves to a file that
      # exists. Dead links inside article text are reported but do not block --
      # see the script's header for why those two are not the same problem.
      #
      # Deliberately NOT a separate job: the Pages artifact is ~700 MB, so a
      # validate job would upload and re-download all of it to check bytes that
      # are already sitting right here. It reads files rather than making HTTP
      # requests, so it needs no server and cannot be flaky.
      - name: Validate the built site
        run: jbang scripts/validate/BuiltSite.java

      # The browser half of the gate. Everything above is static analysis; this
      # is the only thing that can tell whether the site WORKS -- search is
      # filled in client-side by Pagefind, the maps and the lightbox exist only
      # after JavaScript runs, and all of those fail silently, with a 200 and a
      # full-looking page.
      #
      # The "staging environment" is tests/e2e/server.mjs: the built public/
      # directory served on localhost, reachable only from this run. It mimics
      # GitHub Pages specifically (pretty URLs, a 301 on a missing trailing
      # slash, 404.html with a 404 status, everything under the base path), so a
      # link that escapes /website/ fails here exactly as it would in
      # production. No staging deploy, nothing public, nothing to clean up.
      #
      # Third-party requests are stubbed inside the tests, so this makes no
      # network calls to YouTube, Vimeo or Google Fonts and cannot go red
      # because someone else's CDN is having an afternoon.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      # The browser binary is ~170 MB and does not change between runs; the key
      # is the lockfile, so it re-downloads exactly when the pinned Playwright
      # version moves and never otherwise.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Check the site in a browser
        run: npm run test:e2e

      # Only on failure, and only for a fortnight: the trace and screenshots are
      # how you find out WHY a deploy was blocked without reproducing it
      # locally, and they are worthless once the run is old.
      - name: Upload the failing traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
