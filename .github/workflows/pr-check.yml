name: PR check

on:
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history so the alt-text warnings below can be diffed against
          # the base branch. On the default shallow clone the base sha is not
          # present, the diff fails, and the check falls back to reporting the
          # whole archive -- which is 900 files of imported backlog nobody in
          # this PR can act on.
          fetch-depth: 0

      # PINNED, not "latest". `latest` makes the action resolve the version
      # through formulae.brew.sh, so a read ECONNRESET from Homebrew's API --
      # a third party with no stake in this site -- fails the whole run before
      # Hugo is even downloaded. It did, on 33050054411. A pin also means the
      # site is built by the version it was developed against rather than by
      # whatever shipped this morning: a Hugo release that changes a template
      # function is not something to discover from a red deploy.
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Set up JBang
        # Pinned to a TAG, not @main: tracking a moving branch means an upstream
        # commit can break this workflow with no change on our side.
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Validate post/author/page frontmatter
        # --changed-since scopes the ACCESSIBILITY WARNINGS (missing image
        # descriptions) to what this branch touches; every other check still
        # looks at the whole tree, and only those can fail the run.
        run: jbang scripts/validate/Frontmatter.java --changed-since ${{ github.event.pull_request.base.sha }}

      - name: Build site (catches template/content errors)
        run: hugo --gc --minify

      # The same gate build-deploy.yml runs, here so a PR that breaks a link the
      # templates emit -- or drops a whole section out of the build -- is caught
      # at review time instead of at deploy time. Needs the built site, so it has
      # to follow the step above. Pagefind is not run on a PR and nothing here
      # depends on it: the search page imports pagefind.js from a JS variable,
      # not from a src attribute, so it is not one of the links checked.
      - name: Validate the built site
        run: jbang scripts/validate/BuiltSite.java
