name: PR check

on:
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Set up JBang
        # Pinned to a TAG, not @main: tracking a moving branch means an upstream
        # commit can break this workflow with no change on our side.
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Validate post/author/page frontmatter
        run: jbang scripts/validate/Frontmatter.java

      - name: Build site (catches template/content errors)
        run: hugo --gc --minify
