name: PR check

on:
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Set up JBang
        uses: jbangdev/setup-jbang@main

      - name: Validate post/author/page frontmatter
        run: jbang scripts/validate/Frontmatter.java

      - name: Build site (catches template/content errors)
        run: hugo --gc --minify
